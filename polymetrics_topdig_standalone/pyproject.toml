[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polymetrics"
version = "0.2.2+topdig"
description = "Experimental Polymetrics extension with TopDiG building boundary metrics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "geopandas>=0.14",
  "numpy>=1.24",
  "pandas>=1.5",
  "scipy>=1.10",
  "shapely>=2.0",
]

[project.optional-dependencies]
topo = ["opencv-python-headless>=4.8"]
test = ["pytest>=7", "opencv-python-headless>=4.8"]

[project.scripts]
polymetrics = "polymetrics.cli:main"

[tool.setuptools.packages.find]
include = ["polymetrics*"]
